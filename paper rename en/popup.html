<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      padding: 12px;
      background: #fafafa;
      color: #333;
    }
    h1 {
      font-size: 15px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #4285f4;
      color: #4285f4;
    }

    /* Candidate card */
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-left: 3px solid transparent;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card.selected {
      border-left-color: #4285f4;
      box-shadow: 0 1px 4px rgba(66,133,244,0.15);
    }
    .card-author {
      font-size: 12px;
      color: #666;
      margin-bottom: 2px;
    }
    .card-title {
      font-size: 13px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-btn {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      background: #4285f4;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .card-btn:hover {
      background: #3367d6;
    }
    .card.selected .card-btn {
      background: #aaa;
      cursor: default;
    }

    /* Send status badge */
    .send-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
    }
    .send-badge.pending {
      background: #f0f0f0;
      color: #999;
    }
    .send-badge.sent {
      background: #e6f4ea;
      color: #34a853;
    }
    .send-badge.error {
      background: #fce8e6;
      color: #ea4335;
    }
    .send-badge.unsent {
      background: #f0f0f0;
      color: #999;
    }
    .send-badge.sending {
      background: #e8f0fe;
      color: #4285f4;
    }

    /* Send button */
    .send-btn {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      background: #34a853;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-left: 6px;
    }
    .send-btn:hover {
      background: #2d9249;
    }
    .send-btn:disabled {
      background: #aaa;
      cursor: default;
    }

    /* Empty message */
    .empty-msg {
      font-size: 13px;
      color: #999;
      text-align: center;
      padding: 24px 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Paper Renamer</h1>
  <div id="container">
    <div class="empty-msg">Loading...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
